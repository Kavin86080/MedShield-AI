<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedShield-X | Enterprise AI Clinical Decision Support</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="MedShield-X — Enterprise AI Clinical Decision Support System. Explainable AI, Multi-Agent Reasoning, Medical Imaging, and Research Analytics for clinical professionals.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2563EB">

    <!-- Google Fonts: Inter + Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- MedShield-X Design System -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">

    <!-- Anti-FOUC: Apply saved theme immediately before render -->
    <script>
        (function () {
            // Restore saved theme (defaults to light — the enterprise default)
            const saved = localStorage.getItem('medshield_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);

            // Auth guard: redirect unauthenticated users to login
            const token = localStorage.getItem('medshield_access_token');
            const path = window.location.pathname;
            const publicPaths = ['/login', '/register'];
            if (!token && !publicPaths.includes(path)) {
                window.location.href = '/login';
            } else if (token && publicPaths.includes(path)) {
                window.location.href = '/';
            }
        })();
    </script>
</head>
<body>
    <div id="app-layout">

        <!-- Sidebar Navigation -->
        {% include "sidebar.html" %}

        <!-- Main Panel -->
        <div id="main-content">

            <!-- Top Navigation Bar -->
            {% include "navbar.html" %}

            <!-- Page Content -->
            <main class="page-container" id="page-main">
                {% block content %}{% endblock %}
            </main>

            <!-- Footer -->
            {% include "footer.html" %}

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- MedShield-X Global JS (theme, sidebar, auth, profile) -->
    <script src="/static/js/main.js"></script>

    <!-- MedShield-X Activity Store (shared across all pages) -->
    <script src="/static/js/medshield-activity.js"></script>

    <!-- Page-Specific Scripts -->
    {% block scripts %}{% endblock %}
</body>
</html>
