<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedShield-X Portal Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Style Files -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <div class="access-container">
        <div class="login-card text-center">
            <!-- Brand Head -->
            <div class="mb-4">
                <i class="fa-solid fa-shield-heart text-gradient mb-2" style="font-size: 3.5rem;"></i>
                <h3 class="fw-bold mb-1">MedShield-X</h3>
                <p class="text-muted small">AI-Powered Multi-Agent Diagnostic Support</p>
            </div>
            
            <!-- Error Alert Area -->
            <div class="alert alert-danger p-2 small mb-3 text-start d-none" id="login-error-alert" style="border-radius: 10px; font-size: 0.8rem; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #fca5a5;">
                <i class="fa-solid fa-circle-exclamation me-1"></i><span id="login-error-text">Login failed.</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="text-start">
                <div class="mb-3">
                    <label for="login-email" class="form-label small fw-semibold">Clinical Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 bg-transparent text-muted" style="border: 1px solid rgba(255,255,255,0.1); border-top-left-radius: 10px; border-bottom-left-radius: 10px;">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" class="form-control form-control-premium border-start-0" id="login-email" required placeholder="alex@medshield.x" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="d-flex justify-content-between mb-1">
                        <label for="login-pass" class="form-label small fw-semibold mb-0">Security Password</label>
                        <a href="#" class="small text-primary text-decoration-none">Forgot?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 bg-transparent text-muted" style="border: 1px solid rgba(255,255,255,0.1); border-top-left-radius: 10px; border-bottom-left-radius: 10px;">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" class="form-control form-control-premium border-start-0" id="login-pass" required placeholder="••••••••••••" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold mb-3" id="login-submit-btn">
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Access Workspace
                </button>
                
                <div class="text-center small text-muted">
                    Need workspace access? <a href="/register" class="text-primary text-decoration-none fw-semibold">Register Portal</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.getElementById("login-form");
            const emailInput = document.getElementById("login-email");
            const passwordInput = document.getElementById("login-pass");
            const submitBtn = document.getElementById("login-submit-btn");
            const errorAlert = document.getElementById("login-error-alert");
            const errorText = document.getElementById("login-error-text");

            form.addEventListener("submit", async function(e) {
                e.preventDefault();
                errorAlert.classList.add("d-none");
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i>Verifying credentials...';

                try {
                    const response = await fetch("/api/auth/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: emailInput.value,
                            password: passwordInput.value
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.detail || "Authentication failed. Please check your credentials.");
                    }

                    // Save token details
                    localStorage.setItem("medshield_access_token", data.access_token);
                    localStorage.setItem("medshield_refresh_token", data.refresh_token);

                    // Redirect to home
                    window.location.href = "/";
                } catch (err) {
                    errorText.textContent = err.message;
                    errorAlert.classList.remove("d-none");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Access Workspace';
                }
            });
        });
    </script>
</body>
</html>
