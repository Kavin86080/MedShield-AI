<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedShield-X Portal Registration</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Style Files -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <div class="access-container">
        <div class="login-card text-center">
            <!-- Brand Head -->
            <div class="mb-4">
                <i class="fa-solid fa-shield-heart text-gradient mb-2" style="font-size: 3.5rem;"></i>
                <h3 class="fw-bold mb-1">MedShield-X</h3>
                <p class="text-muted small">Register New Practitioner Portal Account</p>
            </div>
            
            <!-- Error Alert Area -->
            <div class="alert alert-danger p-2 small mb-3 text-start d-none" id="reg-error-alert" style="border-radius: 10px; font-size: 0.8rem; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #fca5a5;">
                <i class="fa-solid fa-circle-exclamation me-1"></i><span id="reg-error-text">Registration failed.</span>
            </div>

            <!-- Registration Form -->
            <form id="register-form" class="text-start">
                <div class="mb-3">
                    <label for="reg-name" class="form-label small fw-semibold">Practitioner Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 bg-transparent text-muted" style="border: 1px solid rgba(255,255,255,0.1); border-top-left-radius: 10px; border-bottom-left-radius: 10px;">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control form-control-premium border-start-0" id="reg-name" required placeholder="e.g. Dr. Alex Thorne" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="reg-email" class="form-label small fw-semibold">Clinical Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 bg-transparent text-muted" style="border: 1px solid rgba(255,255,255,0.1); border-top-left-radius: 10px; border-bottom-left-radius: 10px;">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" class="form-control form-control-premium border-start-0" id="reg-email" required placeholder="alex@medshield.x" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="reg-specialty" class="form-label small fw-semibold">Clinical Specialty</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 bg-transparent text-muted" style="border: 1px solid rgba(255,255,255,0.1); border-top-left-radius: 10px; border-bottom-left-radius: 10px;">
                            <i class="fa-solid fa-user-doctor"></i>
                        </span>
                        <select class="form-select form-control-premium border-start-0" id="reg-specialty" required style="border-top-left-radius: 0; border-bottom-left-radius: 0; cursor: pointer;">
                            <option value="">Select specialty...</option>
                            <option value="General Practitioner">General Practitioner</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Radiology">Radiology</option>
                            <option value="Oncology">Oncology</option>
                            <option value="Pathology">Pathology</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="Internal Medicine">Internal Medicine</option>
                            <option value="Emergency Medicine">Emergency Medicine</option>
                            <option value="Surgery">Surgery</option>
                            <option value="Orthopaedics">Orthopaedics</option>
                            <option value="Pulmonology">Pulmonology</option>
                            <option value="Endocrinology">Endocrinology</option>
                            <option value="Psychiatry">Psychiatry</option>
                            <option value="Dermatology">Dermatology</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="reg-pass" class="form-label small fw-semibold">Choose Security Password</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 bg-transparent text-muted" style="border: 1px solid rgba(255,255,255,0.1); border-top-left-radius: 10px; border-bottom-left-radius: 10px;">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" class="form-control form-control-premium border-start-0" id="reg-pass" required placeholder="Min. 8 characters" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold mb-3" id="reg-submit-btn">
                    <i class="fa-solid fa-user-plus me-2"></i>Create Portal Account
                </button>
                
                <div class="text-center small text-muted">
                    Already registered? <a href="/login" class="text-primary text-decoration-none fw-semibold">Workspace Access</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.getElementById("register-form");
            const nameInput = document.getElementById("reg-name");
            const emailInput = document.getElementById("reg-email");
            const specialtySelect = document.getElementById("reg-specialty");
            const passwordInput = document.getElementById("reg-pass");
            const submitBtn = document.getElementById("reg-submit-btn");
            const errorAlert = document.getElementById("reg-error-alert");
            const errorText = document.getElementById("reg-error-text");

            form.addEventListener("submit", async function(e) {
                e.preventDefault();
                errorAlert.classList.add("d-none");

                if (passwordInput.value.length < 8) {
                    errorText.textContent = "Password must be at least 8 characters.";
                    errorAlert.classList.remove("d-none");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i>Creating account...';

                try {
                    const response = await fetch("/api/auth/register", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: emailInput.value,
                            password: passwordInput.value,
                            full_name: nameInput.value,
                            specialty: specialtySelect.value
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.detail || "Registration failed. Please check your data.");
                    }

                    // Save token details and log in automatically
                    localStorage.setItem("medshield_access_token", data.access_token);
                    localStorage.setItem("medshield_refresh_token", data.refresh_token);

                    // Redirect to home
                    window.location.href = "/";
                } catch (err) {
                    errorText.textContent = err.message;
                    errorAlert.classList.remove("d-none");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-user-plus me-2"></i>Create Portal Account';
                }
            });
        });
    </script>
</body>
</html>
